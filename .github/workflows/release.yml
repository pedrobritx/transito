name: Build and Release macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transito-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build SwiftUI app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build without Apple signing credentials
        run: |
          xcodebuild \
            -project packages/macos/Transito.xcodeproj \
            -scheme Transito \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TransitoDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app as ZIP and DMG
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/TransitoDerivedData/Build/Products/Release/Transito.app"
          test -d "$APP_PATH"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Transito-${VERSION}-macOS.zip"
          STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$STAGING/Transito.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Transito" -srcfolder "$STAGING" -format UDZO "dist/Transito-${VERSION}.dmg"
          (cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Transito-macOS-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "$(tr -d '[:space:]' < VERSION)"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Transito-macOS-${{ github.run_number }}
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
